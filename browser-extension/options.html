<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Email Article Analyzer Bridge Options</title>
    <style>
      body {
        color: #0f172a;
        font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 24px;
        max-width: 560px;
      }

      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input {
        border: 1px solid #cbd5e1;
        box-sizing: border-box;
        font: inherit;
        padding: 8px 10px;
        width: 100%;
      }

      button {
        background: #0f766e;
        border: 0;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 12px;
        padding: 9px 14px;
      }

      p {
        color: #475569;
      }

      #status {
        color: #0f766e;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Email Article Analyzer Bridge</h1>
    <p>
      Set the backend URL. For local desktop use, keep the default.
      For Raspberry Pi use, enter the Pi URL, for example
      <code>http://192.168.1.50:8000</code>.
    </p>
    <label for="api-base">Backend URL</label>
    <input id="api-base" type="url" placeholder="http://127.0.0.1:8000">
    <label for="backend-password">Backend password</label>
    <input id="backend-password" type="password" autocomplete="current-password">
    <button id="save-button" type="button">Save</button>
    <p id="status" aria-live="polite"></p>
    <script src="options.js"></script>
  </body>
</html>
