[project]
name = "email-article-analyzer"
version = "0.1.0"
description = "Local stock email article automation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "certifi>=2024.0",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "google-api-python-client>=2.150",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "httplib2>=0.22",
  "openai>=1.0",
  "playwright>=1.45",
]

[project.scripts]
email-article-analyzer = "email_article_analyzer.cli:main"

[tool.setuptools.package-data]
email_article_analyzer = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"browser-extension" = [
  "browser-extension/background.js",
  "browser-extension/manifest.json",
  "browser-extension/options.html",
  "browser-extension/options.js",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
